# =============================================================================
# tmux config — vim-style hjkl navigation + mouse scroll + kitty support
# =============================================================================

# ---- General ---------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g escape-time 0                                # no delay for Esc/O in vim
set -g focus-events on                              # needed for kitty focus tracking
set -g set-clipboard on                             # system clipboard integration (kitty osc 52)

# ---- Key bindings ----------------------------------------------------------

# Use a reasonable prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quick reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Split panes with more natural keys
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Vim-style pane navigation (prefix + hjkl) -----------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Vim-style pane resizing (prefix + H/J/K/L) ----------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Kitty-compatible vim-style pane switching WITHOUT prefix ---------------
# Works when TERM is xterm-kitty or tmux-256color with allow-passthrough.
# If these interfere with neovim, comment them out — use prefix+hjkl instead.
# Tmux needs allow-passthrough all (kitty 0.28+) for this to work in kitty.

set -g allow-passthrough all

# Kitty sends these via its own keybindings — uncomment if you only use tmux
# inside kitty and want seamless ctrl+hjkl:
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# ---- Mouse support ---------------------------------------------------------

set -g mouse on

# ---- Visual polish ---------------------------------------------------------

set -g base-index 1              # windows start at 1
set -g pane-base-index 1         # panes start at 1
set -g renumber-windows on       # renumber when a window is closed

set -g status-position top
set -g status-left-length 32
set -g status-right-length 80

set -g status-style "fg=colour255,bg=colour234"
set -g status-left "#[fg=colour234,bg=colour75,bold] #S #[default]"
set -g status-right "#[fg=colour240]%Y-%m-%d %H:%M #[fg=colour75]#h"
set -g window-status-format " #I: #W "
set -g window-status-current-format "#[fg=colour234,bg=colour75,bold] #I: #W #[default]"

set -g pane-active-border-style "fg=colour75"
set -g pane-border-style "fg=colour238"
set -g message-style "fg=colour75,bg=colour234"

# ---- Kitty-specific terminal fixes -----------------------------------------

# Allow kitty to handle extended keys (home/end/etc.)
set -as terminal-features ",xterm-kitty*:extkeys"

# Propagate SSH agent from kitty if present
if-shell 'test -n "$SSH_AUTH_SOCK"' {
  set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"
}

# copy-mode 使用 vi 键位
setw -g mode-keys vi

# 进入 copy-mode
bind-key Escape copy-mode

# vi 风格选择和复制：prefix+[ 进入；v 字符选择；Ctrl-v 方块选择；y 复制
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-on

# y 复制并退出 copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Esc 取消选择
bind-key -T copy-mode-vi Escape send-keys -X cancel

# q 退出 copy-mode
bind-key -T copy-mode-vi q send-keys -X cancel
